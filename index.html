body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:overlay;
  z-index:999;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--term-green-dim);border-radius:4px;}

/* SIDEBAR */
#sidebar{
  width:230px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:22px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  backdrop-filter:blur(6px);
}
#sidebar h1{
  font-family:var(--font-display);
  font-size:19px;
  letter-spacing:3px;
  color:var(--term-green);
  text-transform:uppercase;
  margin-bottom:4px;
  text-shadow:0 0 10px rgba(255,154,60,0.35);
}
#sidebar h1 .cursor{
  display:inline-block;
  width:9px;height:16px;
  background:var(--term-green);
  margin-left:4px;
  animation:BLINK 1s steps(1) infinite;
  vertical-align:-2px;
}
@keyframes BLINK{50%{opacity:0;}}
.sb-sub{font-size:11px;color:var(--text-dim);letter-spacing:1.5px;margin-bottom:14px;text-transform:uppercase;}

.tab-btn{
  background:rgba(255,154,60,0.03);
  border:1px solid var(--line);
  border-left:3px solid transparent;
  color:rgba(234,255,242,0.8);
  border-radius:4px;
  padding:10px 12px;
  font-family:var(--font-mono);
  font-size:14px;
  letter-spacing:0.5px;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.tab-btn:before{content:"> ";color:var(--term-green-dim);}
.tab-btn:hover{border-color:var(--line-hover);background:rgba(255,154,60,0.06);}
.tab-btn.active{background:rgba(255,154,60,0.1);border-color:var(--term-green);border-left-color:var(--term-green);color:#fff;}
.tab-del{opacity:0;color:rgba(255,255,255,0.4);font-size:12px;transition:opacity .15s,color .15s;}
.tab-btn:hover .tab-del{opacity:1;}
.tab-del:hover{color:var(--red);}

#add-tab-btn{
  margin-top:8px;
  background:transparent;
  border:1px dashed var(--term-green-dim);
  color:var(--term-green);
  border-radius:4px;
  padding:10px 12px;
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:1px;
  cursor:pointer;
}
#add-tab-btn:hover{background:rgba(255,154,60,0.08);border-color:var(--term-green);}
#export-md-btn,#import-md-btn{
  background:rgba(255,255,255,0.02);
  border:1px solid var(--line);
  color:var(--text-dim);
  border-radius:4px;
  padding:9px 12px;
  font-family:var(--font-mono);
  font-size:12px;
  cursor:pointer;
}
#export-md-btn{margin-top:auto;}
#export-md-btn:hover,#import-md-btn:hover{border-color:var(--line-hover);color:var(--term-green);}

/* MAIN */
#main{flex:1;padding:26px 30px;overflow-x:auto;position:relative;}
#empty-state{
  color:var(--text-dim);
  text-align:center;
  margin-top:100px;
  font-size:15px;
  letter-spacing:1px;
}
#board-title{
  font-family:var(--font-display);
  font-size:22px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:20px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}
#board-title span{color:var(--term-green);text-shadow:0 0 8px rgba(255,154,60,0.4);}

.board-row{display:flex;gap:20px;align-items:flex-start;}
.col{
  flex:1;
  min-width:290px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:14px;
  min-height:160px;
  backdrop-filter:blur(4px);
}
.col.drag-over{border-color:var(--line-hover);background:rgba(255,154,60,0.05);}
.col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.col-header h2{font-family:var(--font-display);font-size:14px;letter-spacing:2px;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.col-todo .dot{background:var(--term-green);box-shadow:0 0 6px var(--term-green);}
.col-inprogress .dot{background:var(--amber);box-shadow:0 0 6px var(--amber);}
.col-done .dot{background:var(--red);box-shadow:0 0 6px var(--red);}
.col-count{font-size:11px;color:var(--text-dim);background:rgba(255,255,255,0.05);border-radius:10px;padding:2px 8px;}

.add-card-btn{
  width:100%;
  background:transparent;
  border:1px dashed rgba(255,255,255,0.15);
  color:var(--text-dim);
  border-radius:4px;
  padding:9px;
  font-family:var(--font-mono);
  font-size:13px;
  cursor:pointer;
  margin-top:6px;
}
.add-card-btn:hover{border-color:var(--term-green);color:var(--term-green);}

.card{
  background:rgba(3,6,5,0.92);
  border:1px solid var(--line);
  border-left:3px solid var(--term-green);
  border-radius:5px;
  padding:12px 14px;
  margin-bottom:12px;
  cursor:grab;
  position:relative;
  transition:border-color .2s,transform .2s,opacity .2s;
}
.col-inprogress .card{border-left-color:var(--amber);}
.col-done .card{border-left-color:var(--red);}
.card:hover{border-color:var(--line-hover);transform:translateY(-2px);}
.card.dragging{opacity:.3;cursor:grabbing;}
.card-title{font-family:var(--font-mono);font-weight:600;font-size:16px;color:#fff;margin-bottom:6px;padding-right:18px;line-height:1.3;}
.card-desc{font-size:13.5px;line-height:1.5;color:rgba(234,255,242,0.75);margin-bottom:8px;white-space:pre-wrap;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;}
.card-tag{
  font-size:10.5px;
  letter-spacing:0.5px;
  padding:2px 8px;
  border-radius:10px;
  background:rgba(255,154,60,0.1);
  border:1px solid var(--line);
  color:var(--term-green);
  text-transform:uppercase;
}
.card-del{position:absolute;top:10px;right:10px;color:rgba(255,255,255,0.3);font-size:13px;cursor:pointer;}
.card-del:hover{color:var(--red);}

.modal-content{
  background:#0a0f0d;
  color:#eafff2;
  border:1px solid var(--line);
  font-family:var(--font-mono);
  border-radius:6px;
}
.modal-header,.modal-footer{border-color:var(--line);}
.modal-title{font-family:var(--font-display);letter-spacing:1.5px;color:var(--term-green);}
.form-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px;}
.modal-content input,.modal-content textarea{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  color:#fff;
  font-family:var(--font-mono);
  font-size:14px;
}
.modal-content input:focus,.modal-content textarea:focus{
  background:rgba(255,255,255,0.05);
  color:#fff;
  border-color:var(--term-green);
  box-shadow:0 0 0 1px var(--term-green);
}
.btn-term{background:var(--term-green);color:#04140c;border:none;font-family:var(--font-mono);font-weight:700;letter-spacing:1px;}
.btn-term:hover{background:#ffb567;color:#04140c;}
</style>
</head>
<body>

<div id="sidebar">
  <h1>BOARDS<span class="cursor"></span></h1>
  <div class="sb-sub">// select a workspace</div>
  <div id="tab-list"></div>
  <button id="add-tab-btn" onclick="OPEN_ADD_TAB_MODAL()"><i class="fa-solid fa-plus"></i> new_tab</button>
  <button id="export-md-btn" onclick="EXPORT_ACTIVE_BOARD()"><i class="fa-solid fa-file-export"></i> export to obsidian</button>
  <button id="import-md-btn" onclick="document.getElementById('md-file-input').click()"><i class="fa-solid fa-file-arrow-up"></i> import .md</button>
  <input type="file" id="md-file-input" accept=".md" multiple style="display:none" onchange="HANDLE_MD_IMPORT(event)">
</div>

<div id="main">
  <div id="empty-state">&gt; NO ACTIVE BOARD. CLICK "NEW_TAB" TO INITIALIZE ONE.</div>
  <div id="board-title" style="display:none">&gt; <span id="board-title-text"></span></div>
  <div class="board-row" id="board-row" style="display:none">
    <div class="col col-todo" data-status="TODO">
      <div class="col-header"><h2><span class="dot"></span>Todo</h2><span class="col-count" id="count-TODO">0</span></div>
      <div class="card-list" id="list-TODO"></div>
      <button class="add-card-btn" onclick="OPEN_ADD_CARD_MODAL('TODO')"><i class="fa-solid fa-plus"></i> add card</button>
    </div>
    <div class="col col-inprogress" data-status="IN_PROGRESS">
      <div class="col-header"><h2><span class="dot"></span>In Progress</h2><span class="col-count" id="count-IN_PROGRESS">0</span></div>
      <div class="card-list" id="list-IN_PROGRESS"></div>
      <button class="add-card-btn" onclick="OPEN_ADD_CARD_MODAL('IN_PROGRESS')"><i class="fa-solid fa-plus"></i> add card</button>
    </div>
    <div class="col col-done" data-status="DONE">
      <div class="col-header"><h2><span class="dot"></span>Done</h2><span class="col-count" id="count-DONE">0</span></div>
      <div class="card-list" id="list-DONE"></div>
      <button class="add-card-btn" onclick="OPEN_ADD_CARD_MODAL('DONE')"><i class="fa-solid fa-plus"></i> add card</button>
    </div>
  </div>
</div>

<!-- ADD TAB MODAL -->
<div class="modal fade" id="add-tab-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">&gt; new_board</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label">Board name</label>
        <input type="text" class="form-control" id="new-tab-name-input" placeholder="e.g. University">
      </div>
      <div class="modal-footer">
        <button class="btn btn-term" onclick="CONFIRM_ADD_TAB()">Create</button>
      </div>
    </div>
  </div>
</div>

<!-- ADD CARD MODAL -->
<div class="modal fade" id="add-card-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">&gt; new_card</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" id="new-card-title-input" placeholder="Card title">
        </div>
        <div class="mb-3">
          <label class="form-label">Tags <span style="opacity:.6;text-transform:none;">(comma separated)</span></label>
          <input type="text" class="form-control" id="new-card-tags-input" placeholder="e.g. urgent, essay, math101">
        </div>
        <div class="mb-1">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="new-card-desc-input" rows="4" placeholder="Details..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-term" onclick="CONFIRM_ADD_CARD()">Add</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* =====================================================================
   KANBAN BOARD APPLICATION - TERMINAL EDITION
   -----------------------------------------------------------------
   THIS SCRIPT DRIVES A MULTI TAB KANBAN BOARD. EACH TAB REPRESENTS A
   SEPARATE BOARD (E.G. UNIVERSITY, CODING, MISC) WITH THREE COLUMNS:
   TODO, IN_PROGRESS AND DONE. EACH CARD HOLDS A TITLE, TAGS AND A
   DESCRIPTION. BOARDS PERSIST IN LOCALSTORAGE AND CAN ALSO BE
   IMPORTED FROM MARKDOWN FILES, WHERE EACH .MD FILE BECOMES ITS OWN
   TAB. BOARDS CAN BE EXPORTED AS MARKDOWN FILES FORMATTED FOR THE
   OBSIDIAN KANBAN PLUGIN (FRONTMATTER, LANE HEADINGS, CHECKBOX
   ITEMS AND HASHTAG TAGS) SO THEY CAN BE OPENED DIRECTLY IN OBSIDIAN.
   TABS AND CARDS CAN BE DELETED WITH A CONFIRMATION, AND CARDS
   CAN BE DRAGGED BETWEEN COLUMNS TO CHANGE THEIR STATUS.
   ===================================================================== */

let BOARDS = {};
let ACTIVE_TAB = null;
let PENDING_ADD_STATUS = null;
let DRAGGED_CARD_ID = null;

function LOAD_STATE() {
  const RAW = localStorage.getItem('KANBAN_BOARDS_V2');
  BOARDS = RAW ? JSON.parse(RAW) : {};
  ACTIVE_TAB = localStorage.getItem('KANBAN_ACTIVE_TAB_V2') || null;
}

function SAVE_STATE() {
  localStorage.setItem('KANBAN_BOARDS_V2', JSON.stringify(BOARDS));
  localStorage.setItem('KANBAN_ACTIVE_TAB_V2', ACTIVE_TAB || '');
}

function CREATE_BOARD(NAME) {
  if (!NAME || BOARDS[NAME]) return false;
  BOARDS[NAME] = { TODO: [], IN_PROGRESS: [], DONE: [] };
  return true;
}

function DELETE_BOARD(NAME) {
  delete BOARDS[NAME];
  if (ACTIVE_TAB === NAME) {
    const REMAINING = Object.keys(BOARDS);
    ACTIVE_TAB = REMAINING.length ? REMAINING[0] : null;
  }
  SAVE_STATE();
  RENDER_ALL();
}

function RENDER_TABS() {
  const CONTAINER = document.getElementById('tab-list');
  CONTAINER.innerHTML = '';
  Object.keys(BOARDS).forEach(NAME => {
    const BTN = document.createElement('div');
    BTN.className = 'tab-btn' + (NAME === ACTIVE_TAB ? ' active' : '');
    BTN.innerHTML = `<span onclick="SELECT_TAB('${ESCAPE_ATTR(NAME)}')" style="flex:1">${ESCAPE_HTML(NAME)}</span>
      <i class="fa-solid fa-trash tab-del" onclick="event.stopPropagation();CONFIRM_DELETE_TAB('${ESCAPE_ATTR(NAME)}')"></i>`;
    CONTAINER.appendChild(BTN);
  });
}

function SELECT_TAB(NAME) {
  ACTIVE_TAB = NAME;
  SAVE_STATE();
  RENDER_ALL();
}

function CONFIRM_DELETE_TAB(NAME) {
  if (confirm(`Delete the board "${NAME}" and all its cards? This cannot be undone.`)) {
    DELETE_BOARD(NAME);
  }
}

function RENDER_BOARD() {
  const EMPTY_STATE = document.getElementById('empty-state');
  const TITLE = document.getElementById('board-title');
  const ROW = document.getElementById('board-row');

  if (!ACTIVE_TAB || !BOARDS[ACTIVE_TAB]) {
    EMPTY_STATE.style.display = 'block';
    TITLE.style.display = 'none';
    ROW.style.display = 'none';
    return;
  }

  EMPTY_STATE.style.display = 'none';
  TITLE.style.display = 'block';
  ROW.style.display = 'flex';
  document.getElementById('board-title-text').textContent = ACTIVE_TAB;

  ['TODO', 'IN_PROGRESS', 'DONE'].forEach(STATUS => {
    const LIST = document.getElementById(`list-${STATUS}`);
    LIST.innerHTML = '';
    const CARDS = BOARDS[ACTIVE_TAB][STATUS] || [];
    document.getElementById(`count-${STATUS}`).textContent = CARDS.length;
    CARDS.forEach(CARD => {
      const EL = document.createElement('div');
      EL.className = 'card';
      EL.draggable = true;
      EL.dataset.id = CARD.id;
      const TAGS_HTML = (CARD.tags || []).map(T => `<span class="card-tag">${ESCAPE_HTML(T)}</span>`).join('');
      EL.innerHTML = `
        <i class="fa-solid fa-xmark card-del" onclick="CONFIRM_DELETE_CARD('${STATUS}','${CARD.id}')"></i>
        <div class="card-title">${ESCAPE_HTML(CARD.title)}</div>
        ${CARD.desc ? `<div class="card-desc">${ESCAPE_HTML(CARD.desc)}</div>` : ''}
        <div class="card-tags">${TAGS_HTML}</div>
      `;
      EL.addEventListener('dragstart', () => { DRAGGED_CARD_ID = CARD.id; EL.classList.add('dragging'); });
      EL.addEventListener('dragend', () => { EL.classList.remove('dragging'); SAVE_STATE(); });
      LIST.appendChild(EL);
    });
  });
}

function CONFIRM_DELETE_CARD(STATUS, ID) {
  if (!confirm('Delete this card?')) return;
  BOARDS[ACTIVE_TAB][STATUS] = BOARDS[ACTIVE_TAB][STATUS].filter(C => C.id !== ID);
  SAVE_STATE();
  RENDER_BOARD();
}

function INIT_COLUMN_DROP_ZONES() {
  document.querySelectorAll('.col').forEach(COL => {
    COL.addEventListener('dragover', E => { E.preventDefault(); COL.classList.add('drag-over'); });
    COL.addEventListener('dragleave', () => COL.classList.remove('drag-over'));
    COL.addEventListener('drop', E => {
      E.preventDefault();
      COL.classList.remove('drag-over');
      const TARGET_STATUS = COL.dataset.status;
      MOVE_CARD(DRAGGED_CARD_ID, TARGET_STATUS);
    });
  });
}

function MOVE_CARD(CARD_ID, TARGET_STATUS) {
  if (!ACTIVE_TAB || !CARD_ID) return;
  const BOARD = BOARDS[ACTIVE_TAB];
  let FOUND = null;
  ['TODO', 'IN_PROGRESS', 'DONE'].forEach(STATUS => {
    const IDX = BOARD[STATUS].findIndex(C => C.id === CARD_ID);
    if (IDX !== -1) FOUND = { STATUS, IDX };
  });
  if (!FOUND) return;
  const [CARD] = BOARD[FOUND.STATUS].splice(FOUND.IDX, 1);
  BOARD[TARGET_STATUS].push(CARD);
  SAVE_STATE();
  RENDER_BOARD();
}

function OPEN_ADD_TAB_MODAL() {
  document.getElementById('new-tab-name-input').value = '';
  new bootstrap.Modal(document.getElementById('add-tab-modal')).show();
}

function CONFIRM_ADD_TAB() {
  const NAME = document.getElementById('new-tab-name-input').value.trim();
  if (!NAME) return;
  if (!CREATE_BOARD(NAME)) { alert('A board with that name already exists.'); return; }
  ACTIVE_TAB = NAME;
  SAVE_STATE();
  RENDER_ALL();
  bootstrap.Modal.getInstance(document.getElementById('add-tab-modal')).hide();
}

function OPEN_ADD_CARD_MODAL(STATUS) {
  PENDING_ADD_STATUS = STATUS;
  document.getElementById('new-card-title-input').value = '';
  document.getElementById('new-card-tags-input').value = '';
  document.getElementById('new-card-desc-input').value = '';
  new bootstrap.Modal(document.getElementById('add-card-modal')).show();
  setTimeout(() => document.getElementById('new-card-title-input').focus(), 300);
}

function CONFIRM_ADD_CARD() {
  const TITLE = document.getElementById('new-card-title-input').value.trim();
  const TAGS_RAW = document.getElementById('new-card-tags-input').value.trim();
  const DESC = document.getElementById('new-card-desc-input').value.trim();
  if (!TITLE || !ACTIVE_TAB || !PENDING_ADD_STATUS) return;
  const TAGS = TAGS_RAW ? TAGS_RAW.split(',').map(T => T.trim()).filter(Boolean) : [];
  BOARDS[ACTIVE_TAB][PENDING_ADD_STATUS].push({ id: GENERATE_ID(), title: TITLE, tags: TAGS, desc: DESC });
  SAVE_STATE();
  RENDER_BOARD();
  bootstrap.Modal.getInstance(document.getElementById('add-card-modal')).hide();
}

function GENERATE_ID() {
  return 'C' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function ESCAPE_HTML(STR) {
  const DIV = document.createElement('div');
  DIV.textContent = STR;
  return DIV.innerHTML;
}

function ESCAPE_ATTR(STR) {
  return STR.replace(/'/g, "\\'");
}

function BOARD_TO_MARKDOWN(NAME) {
  const BOARD = BOARDS[NAME];
  const LANES = [
    { STATUS: 'TODO', TITLE: 'Todo', CHECKED: false },
    { STATUS: 'IN_PROGRESS', TITLE: 'In Progress', CHECKED: false },
    { STATUS: 'DONE', TITLE: 'Done', CHECKED: true }
  ];
  let OUT = `---\n\nkanban-plugin: board\n\n---\n\n`;
  LANES.forEach(LANE => {
    OUT += `## ${LANE.TITLE}\n\n`;
    (BOARD[LANE.STATUS] || []).forEach(CARD => {
      const BOX = LANE.CHECKED ? 'x' : ' ';
      const TAG_SUFFIX = (CARD.tags && CARD.tags.length)
        ? ' ' + CARD.tags.map(T => '#' + T.replace(/\s+/g, '-')).join(' ')
        : '';
      OUT += `- [${BOX}] ${CARD.title}${TAG_SUFFIX}\n`;
      if (CARD.desc) {
        CARD.desc.split('\n').forEach(LINE => { OUT += `  ${LINE}\n`; });
      }
    });
    OUT += '\n';
  });
  OUT += `\n%% kanban:settings\n\`\`\`\n{"kanban-plugin":"board"}\n\`\`\`\n%%`;
  return OUT;
}

async function EXPORT_ACTIVE_BOARD() {
  if (!ACTIVE_TAB) { alert('No active board to export.'); return; }
  const MARKDOWN = BOARD_TO_MARKDOWN(ACTIVE_TAB);
  const DOWNLOADS = await claude.use('downloads');
  if (!DOWNLOADS) { alert('File downloads are not available in this view.'); return; }
  try {
    await DOWNLOADS.save({ filename: `${ACTIVE_TAB}.md`, data: MARKDOWN });
  } catch (ERR) {
    alert('Export was cancelled or failed.');
  }
}

function HANDLE_MD_IMPORT(EVENT) {
  const FILES = Array.from(EVENT.target.files || []);
  FILES.forEach(FILE => {
    const READER = new FileReader();
    READER.onload = () => {
      const NAME = FILE.name.replace(/\.md$/i, '');
      BOARDS[NAME] = PARSE_MARKDOWN_BOARD(READER.result);
      ACTIVE_TAB = NAME;
      SAVE_STATE();
      RENDER_ALL();
    };
    READER.readAsText(FILE);
  });
  EVENT.target.value = '';
}

function PARSE_MARKDOWN_BOARD(TEXT) {
  const RESULT = { TODO: [], IN_PROGRESS: [], DONE: [] };
  const SECTION_MAP = { 'TODO': 'TODO', 'TO DO': 'TODO', 'IN PROGRESS': 'IN_PROGRESS', 'DONE': 'DONE' };
  let CURRENT = null;
  let LAST_CARD = null;
  TEXT.split('\n').forEach(LINE => {
    if (/^%%/.test(LINE) || /^kanban-plugin/.test(LINE) || /^---\s*$/.test(LINE)) { return; }
    const HEADING_MATCH = LINE.match(/^#{1,2}\s*(.+)/);
    if (HEADING_MATCH) {
      const KEY = HEADING_MATCH[1].trim().toUpperCase();
      if (SECTION_MAP[KEY]) { CURRENT = SECTION_MAP[KEY]; LAST_CARD = null; }
      return;
    }
    const CHECKBOX_MATCH = LINE.match(/^[-*]\s*\[([ xX])\]\s*(.+)/);
    const PLAIN_ITEM_MATCH = !CHECKBOX_MATCH && LINE.match(/^[-*]\s*(.+)/);
    if ((CHECKBOX_MATCH || PLAIN_ITEM_MATCH) && CURRENT) {
      let RAW = (CHECKBOX_MATCH ? CHECKBOX_MATCH[2] : PLAIN_ITEM_MATCH[1]).trim();
      const HASHTAGS = [];
      RAW = RAW.replace(/#([^\s#]+)/g, (M, T) => { HASHTAGS.push(T.replace(/-/g, ' ')); return ''; }).trim();
      let TITLE = RAW, TAGS = HASHTAGS;
      const BRACKET_MATCH = RAW.match(/^(.*?)\s*\[(.+)\]\s*$/);
      if (!HASHTAGS.length && BRACKET_MATCH) {
        TITLE = BRACKET_MATCH[1].trim();
        TAGS = BRACKET_MATCH[2].split(',').map(T => T.trim()).filter(Boolean);
      }
      LAST_CARD = { id: GENERATE_ID(), title: TITLE, tags: TAGS, desc: '' };
      RESULT[CURRENT].push(LAST_CARD);
      return;
    }
    const DESC_MATCH = LINE.match(/^\s{2,}(.+)/);
    if (DESC_MATCH && LAST_CARD) {
      LAST_CARD.desc = LAST_CARD.desc ? `${LAST_CARD.desc}\n${DESC_MATCH[1]}` : DESC_MATCH[1];
    }
  });
  return RESULT;
}

function RENDER_ALL() {
  RENDER_TABS();
  RENDER_BOARD();
  INIT_COLUMN_DROP_ZONES();
}

LOAD_STATE();
RENDER_ALL();
</script>
</body>
